name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Test Suite
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Verify TypeScript & Build Lint
        run: npm run lint

      - name: Run Unit Tests (Auth, Electrical Calculations, Form Validation, Version)
        run: npm run test:unit
        env:
          CI: true

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers and System Dependencies
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright System Dependencies Only
        run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-failure-report
          path: playwright-report/
          retention-days: 14

  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    needs: test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Production Assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          VITE_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
          VITE_GITHUB_REPO: 'anthonywrather/ajwmes'
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
