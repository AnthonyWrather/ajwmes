name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
          cd ..

      - name: Build Cloud Functions
        run: npm run build:functions

      - name: Build Production Assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          VITE_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
          VITE_GITHUB_REPO: 'anthonywrather/ajwmes'
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          firebaseToolsVersion: '15.34.0'
