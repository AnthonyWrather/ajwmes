name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Test Suite
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Verify TypeScript & Build Lint
        run: npm run lint

      - name: Run Unit Tests (Auth, Electrical Calculations, Form Validation, Version)
        run: npm run test:unit
        env:
          CI: true

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
          cd ..

      - name: Run Cloud Functions Tests & Build
        run: |
          npm run test:functions
          npm run build:functions

      - name: Build Production Assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          VITE_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
          VITE_GITHUB_REPO: 'anthonywrather/ajwmes'
        run: npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 1

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Chromium binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium & System Dependencies
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright System Dependencies Only
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run Playwright E2E Fast Deployment Gate (Desktop & Mobile Chromium)
        run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 2

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-failure-report
          path: playwright-report/
          retention-days: 14

  build_and_deploy:
    name: Deploy to Firebase Hosting
    needs: test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Production Dist Artifact
        uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          firebaseToolsVersion: '15.34.0'
