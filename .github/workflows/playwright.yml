name: Playwright Cross-Browser Matrix Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Unit Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run TypeScript Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit
        env:
          CI: true

  e2e:
    name: E2E (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 'chromium'
            slug: 'desktop-chrome'
          - project: 'firefox'
            slug: 'desktop-firefox'
          - project: 'webkit'
            slug: 'desktop-safari'
          - project: 'Mobile Chrome'
            slug: 'mobile-chrome'
          - project: 'Mobile Safari'
            slug: 'mobile-safari'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers and System Dependencies
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright System Dependencies Only
        run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run Playwright E2E (${{ matrix.project }})
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          ALL_BROWSERS: 'true'
          PLAYWRIGHT_WORKERS: 2

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.slug }}
          path: playwright-report/
          retention-days: 14
