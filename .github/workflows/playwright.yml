name: Playwright Cross-Browser Matrix Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Unit Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run TypeScript Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit
        env:
          CI: true

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
          cd ..

      - name: Run Cloud Functions Tests & Build
        run: |
          npm run test:functions
          npm run build:functions

  e2e:
    name: E2E (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 'chromium'
            browser: 'chromium'
            slug: 'desktop-chrome'
            os: 'ubuntu-latest'
            workers: 2
          - project: 'firefox'
            browser: 'firefox'
            slug: 'desktop-firefox'
            os: 'ubuntu-latest'
            workers: 2
          - project: 'webkit'
            browser: 'webkit'
            slug: 'desktop-safari'
            os: 'macos-latest'
            workers: 2
          - project: 'Mobile Chrome'
            browser: 'chromium'
            slug: 'mobile-chrome'
            os: 'ubuntu-latest'
            workers: 2
          - project: 'Mobile Safari'
            browser: 'webkit'
            slug: 'mobile-safari'
            os: 'macos-latest'
            workers: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Install Playwright Browser and System Dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright E2E (${{ matrix.project }})
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          ALL_BROWSERS: 'true'
          PLAYWRIGHT_WORKERS: ${{ matrix.workers }}

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.slug }}
          path: playwright-report/
          retention-days: 14
