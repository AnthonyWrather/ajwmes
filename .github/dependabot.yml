# Dependabot configuration for AJW Marine Electrical Services
# Reference: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # 1. Frontend Core & Dev Dependencies (React 19, Vite 8, Tailwind v4, Playwright)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "npm(frontend)"
      include: "scope"
    reviewers:
      - "AnthonyWrather"
    labels:
      - "dependencies"
      - "frontend"

  # 2. 2nd Gen Firebase Cloud Functions (Firebase Admin, Firebase Functions, Resend, ShipStation)
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "daily"
      time: "05:15"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "npm(functions)"
      include: "scope"
    reviewers:
      - "AnthonyWrather"
    labels:
      - "dependencies"
      - "cloud-functions"

  # 3. GitHub Actions Workflows (CI/CD, Playwright, Firebase Deployments)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "actions"
      include: "scope"
    reviewers:
      - "AnthonyWrather"
    labels:
      - "dependencies"
      - "github-actions"
