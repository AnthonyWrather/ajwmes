<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#050C1A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Anchor Ring -->
  <circle cx="256" cy="118" r="38" fill="none" stroke="url(#cyanGrad)" stroke-width="20" />
  
  <!-- Anchor Crossbar / Stock with Circuit Nodes -->
  <line x1="150" y1="185" x2="362" y2="185" stroke="#94A3B8" stroke-width="18" stroke-linecap="round" />
  <circle cx="150" cy="185" r="14" fill="#38BDF8" />
  <circle cx="362" cy="185" r="14" fill="#38BDF8" />

  <!-- Center Electric Bolt converting into Anchor Shank -->
  <path d="M 272 170 L 230 260 L 282 260 L 240 370" fill="none" stroke="#38BDF8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Flukes / Arms of Anchor -->
  <path d="M 110 320 C 130 420, 382 420, 402 320" fill="none" stroke="url(#cyanGrad)" stroke-width="22" stroke-linecap="round" />
  
  <!-- Arrow Palms -->
  <polygon points="110,320 85,345 130,345" fill="#38BDF8" />
  <polygon points="402,320 427,345 382,345" fill="#38BDF8" />

  <!-- Anchor Base Crown -->
  <circle cx="256" cy="415" r="16" fill="#38BDF8" />
</svg>
